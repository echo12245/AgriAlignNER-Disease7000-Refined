model:
  name: AgriAlignNER


text_encoder:
  backbone: BERT
  hidden_size: 768


visual_encoder:
  backbone: ResNet152

  features:
    global: true
    grid: true
    roi: true


cross_modal_alignment:

  entity_level:
    name: EDGA

    text_projection: true
    visual_projection: true
    gated_residual_fusion: true


  token_level:
    name: AMGCA
    multi_head_attention: true


fusion:
  strategy: adaptive_entity_token_fusion


boundary_modeling:

  auxiliary_boundary_scheme: B-M-O

  auxiliary_labels: 3

  decoder:
    name: CRF
    label_scheme: BIO


training:

  epochs: 60

  batch_size: 32

  optimizer: AdamW

  learning_rate:3e-6

  warmup_ratio: 0.05

  dropout: 0.1

  max_sequence_length: 256


loss:

  ner_loss

  boundary_loss

  contrastive_loss:

    name: InfoNCE

    temperature: 0.07


experiment:

  seed:
    - 2021
    - 2022
    - 2023
    - 2024
    - 2025
    
  metric:
    - Precision
    - Recall
    - F1
